version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: dine_flow_postgres
    restart: always
    environment:
      POSTGRES_USER: amruthsri
      POSTGRES_PASSWORD: password
      POSTGRES_DB: amruthsri_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:7
    container_name: dine_flow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: